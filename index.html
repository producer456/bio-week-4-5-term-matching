<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO Week 4–5 Term Matching</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header>
        <h1>BIO — Week 4 &amp; 5 Term Matching</h1>
        <div class="header-controls">
            <div class="mode-toggle">
                <button id="btn-teacher" class="mode-btn active">Teacher Mode</button>
                <button id="btn-student" class="mode-btn">Student Mode</button>
            </div>
        </div>
    </header>

    <nav class="activity-tabs">
        <button class="activity-tab active" data-activity="definitions">Term ↔ Definition</button>
        <button class="activity-tab" data-activity="slides">Term ↔ Slide</button>
    </nav>

    <nav class="group-tabs" id="group-tabs"></nav>

    <main>
        <div id="teacher-view" class="view"></div>
        <div id="student-view" class="view" style="display:none;"></div>
    </main>

    <div class="footer-actions">
        <button class="action-btn save-btn" onclick="saveUserData()">Save</button>
        <button class="action-btn data-btn" onclick="exportData()">Export</button>
        <button class="action-btn data-btn" onclick="document.getElementById('import-file').click()">Import</button>
        <button class="action-btn reset-btn" onclick="resetAllData()">Reset to Defaults</button>
        <input type="file" id="import-file" accept="application/json,.json" style="display:none;" onchange="importData(event)">
    </div>

    <div id="toast" class="toast"></div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)" title="Close (Esc)">×</button>
        <img id="lightbox-img" alt="Slide full size">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="data.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
